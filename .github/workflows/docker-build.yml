name: Docker 镜像构建

# 触发条件：主分支推送后构建并发布镜像，也支持手动触发。
# 发布目标为 GitHub Container Registry（GHCR），使用仓库自带的 GITHUB_TOKEN，无需额外密钥。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  backend:
    name: 构建后端镜像
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/deploy/Dockerfile
          push: false
          load: true
          tags: quickshare-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 校验后端镜像
        run: |
          docker image inspect quickshare-backend:${GITHUB_SHA} > /dev/null
          docker run --rm --entrypoint python quickshare-backend:${GITHUB_SHA} \
            -c "import django, channels, channels_redis, uvicorn, psycopg; print('deps ok')"

      - name: 登录 GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送后端镜像
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${REGISTRY}/${OWNER}/quickshare-backend"
          docker tag "quickshare-backend:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker tag "quickshare-backend:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "已推送 ${IMAGE}:${GITHUB_SHA} 与 ${IMAGE}:latest"

  frontend:
    name: 构建前端镜像
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/deploy/Dockerfile
          push: false
          load: true
          tags: quickshare-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: 校验前端镜像
        run: |
          docker image inspect quickshare-frontend:${GITHUB_SHA} > /dev/null
          docker run --rm --entrypoint sh quickshare-frontend:${GITHUB_SHA} \
            -c 'test -s /srv/index.html && test -d /srv/assets && echo "static ok"'

      - name: 登录 GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送前端镜像
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${REGISTRY}/${OWNER}/quickshare-frontend"
          docker tag "quickshare-frontend:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker tag "quickshare-frontend:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "已推送 ${IMAGE}:${GITHUB_SHA} 与 ${IMAGE}:latest"
